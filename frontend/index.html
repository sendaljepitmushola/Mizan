<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Mizan - Mesin Pencari Hadis</title>

  <!-- Import Font Playfair Display (Serif Mockup) & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --navy-primary: #0F284B;
      --gold-accent: #B8860B;
      --bg-slate: #F4F6F9;
      --text-dark: #1E293B;
      --text-gray: #64748B;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-slate);
      color: var(--text-dark);
      padding: 40px 20px;
      display: flex;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
    }

    .wrapper {
      width: 100%;
      max-width: 1180px;
    }

    /* KARTU UTAMA */
    .hero-container {
      position: relative;
      background-color: #FAFAFA;
      border-radius: 36px;
      padding: 36px 48px 130px 48px;
      box-shadow: 0 15px 40px rgba(15, 40, 75, 0.04);
      overflow: hidden;
      min-height: 440px;
    }

    /* FRAME LENGKUNG KIRI (PILIHAN DARI STRUKTUR AWAL LU) */
    .arch-bg-left {
      position: absolute;
      top: -20px;
      left: -30px;
      width: 380px;
      height: 120%;
      border: 1.5px solid #E2E8F0;
      border-top-right-radius: 200px;
      pointer-events: none;
      z-index: 1;
      opacity: 0.75;
    }

    .arch-bg-left-inner {
      position: absolute;
      top: 12px;
      left: 12px;
      right: -1.5px;
      bottom: -12px;
      border: 1px dashed #CBD5E1;
      border-top-right-radius: 188px;
    }

    /* GAMBAR KANAN + BLEND SMUDGE (TIDAK PATAH) */
    .hero-illustration-right {
      position: absolute;
      top: 0;
      right: 0;
      width: 480px;
      height: 100%;
      background-image: url('kanan.png');
      background-size: cover;
      background-repeat: no-repeat;
      background-position: center right;
      z-index: 2;
      pointer-events: none;

      /* Bikin batas kiri gambar memudar menyatu dengan background */
      -webkit-mask-image: linear-gradient(to right, transparent 0%, black 20%);
      mask-image: linear-gradient(to right, transparent 0%, black 20%);
    }

    /* NAVBAR */
    .navbar {
      position: relative;
      z-index: 10;
      display: flex;
      justify-content: flex-end;
      margin-bottom: 20px;
    }

    .nav-list {
      display: flex;
      gap: 32px;
      list-style: none;
    }

    .nav-item a {
      display: flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      color: var(--text-gray);
      font-size: 0.92rem;
      font-weight: 600;
    }

    .nav-item.active a {
      color: var(--navy-primary);
      position: relative;
    }

    .nav-item.active a::after {
      content: '';
      position: absolute;
      bottom: -6px;
      left: 0;
      width: 100%;
      height: 3px;
      background-color: var(--gold-accent);
      border-radius: 2px;
    }

    /* HERO CONTENT */
    .hero-content {
      position: relative;
      z-index: 5;
      display: grid;
      grid-template-columns: 280px 1fr;
      align-items: center;
      gap: 30px;
      margin-top: 10px;
    }

    /* BRANDING (KIRI) */
    .brand-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    /* SVG LOGO EMBEDDED (TIMBANGAN + BUKU) */
    .brand-logo-svg {
      width: 120px;
      height: auto;
      margin-bottom: 10px;
    }

    .brand-tag {
      font-family: 'Playfair Display', serif;
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--navy-primary);
      letter-spacing: 4px;
    }

    .brand-title {
      font-family: 'Playfair Display', serif;
      font-size: 3.2rem;
      font-weight: 800;
      color: var(--navy-primary);
      letter-spacing: 2px;
      line-height: 0.95;
      margin: 2px 0 4px 0;
    }

    .brand-sub {
      font-size: 0.72rem;
      font-weight: 800;
      color: var(--gold-accent);
      letter-spacing: 2px;
    }

    .brand-meta {
      margin-top: 20px;
      font-size: 0.76rem;
      color: var(--text-gray);
      line-height: 1.4;
    }

    .brand-meta strong {
      color: var(--navy-primary);
    }

    /* HEADLINE (TENGAH) */
    .headline-section {
      padding-left: 10px;
      max-width: 440px;
    }

    .headline-main {
      font-family: 'Playfair Display', serif;
      font-size: 2.7rem;
      font-weight: 800;
      color: var(--navy-primary);
      line-height: 1.2;
      letter-spacing: -0.5px;
    }

    .headline-main span.gold-text {
      color: var(--gold-accent);
    }

    .headline-sub {
      margin-top: 10px;
      font-size: 0.92rem;
      color: var(--text-gray);
      font-weight: 500;
    }

    /* SEARCH BAR */
    .search-wrapper {
      position: relative;
      z-index: 20;
      max-width: 780px;
      margin: -55px auto 0 auto;
    }

    .search-card {
      background: #FFFFFF;
      border-radius: 22px;
      padding: 16px 20px;
      box-shadow: 0 15px 35px rgba(15, 40, 75, 0.08);
      border: 1px solid #F1F5F9;
    }

    .search-input-box {
      display: flex;
      align-items: center;
      background: #FFFFFF;
      border: 1.5px solid #E2E8F0;
      border-radius: 14px;
      padding: 5px 5px 5px 16px;
    }

    .search-icon {
      margin-right: 12px;
      color: #94A3B8;
      flex-shrink: 0;
    }

    .search-input {
      flex: 1;
      border: none;
      outline: none;
      font-size: 0.95rem;
      font-family: inherit;
      color: var(--text-dark);
    }

    .btn-search {
      background-color: var(--navy-primary);
      color: #FFFFFF;
      border: none;
      padding: 12px 26px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
    }

    .tags-container {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 12px;
      flex-wrap: wrap;
    }

    .tags-label {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-gray);
      margin-right: 4px;
    }

    .tag-item {
      background: #F1F5F9;
      color: #475569;
      padding: 4px 12px;
      border-radius: 16px;
      font-size: 0.78rem;
      font-weight: 600;
      text-decoration: none;
    }
  </style>
</head>
<body>

  <div class="wrapper">

    <header class="hero-container">
      
      <!-- Arch Kiri -->
      <div class="arch-bg-left">
        <div class="arch-bg-left-inner"></div>
      </div>

      <!-- Gambar Kanan -->
      <div class="hero-illustration-right"></div>

      <!-- Navbar -->
      <nav class="navbar">
        <ul class="nav-list">
          <li class="nav-item active"><a href="#">Beranda</a></li>
          <li class="nav-item"><a href="#">Pencarian</a></li>
          <li class="nav-item"><a href="#">Bookmark</a></li>
          <li class="nav-item"><a href="#">Tentang</a></li>
        </ul>
      </nav>

      <!-- Content -->
      <div class="hero-content">
        
        <!-- Branding Kiri -->
        <div class="brand-section">
          <!-- Logo Timbangan & Buku Vector Direct (Nggak Akan Broken) -->
          <svg class="brand-logo-svg" viewBox="0 0 120 70" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M15 42 C 35 34 60 38 60 48 C 60 38 85 34 105 42 L 105 48 C 85 40 60 45 60 55 C 60 45 35 40 15 48 Z" fill="#0F284B"/>
            <path d="M20 39 C 38 33 60 37 60 45 C 60 37 82 33 100 39 L 100 42 C 82 36 60 41 60 49 C 60 41 38 36 20 42 Z" fill="#B8860B"/>
            <line x1="60" y1="10" x2="60" y2="45" stroke="#B8860B" stroke-width="2.5"/>
            <path d="M30 20 Q 60 14 90 20" stroke="#B8860B" stroke-width="2" fill="none"/>
            <path d="M22 30 Q 30 35 38 30 Z" fill="#B8860B"/>
            <path d="M82 30 Q 90 35 98 30 Z" fill="#B8860B"/>
          </svg>

          <span class="brand-tag">PROJECT</span>
          <h1 class="brand-title">MIZAN</h1>
          <span class="brand-sub">MESIN PENCARI HADIS</span>

          <p class="brand-meta">
            Designed & Developed by <strong>Deny D</strong><br>
            <span style="color: #94A3B8; font-style: italic;">--sendaljepitmushola--</span>
          </p>
        </div>

        <!-- Headline Tengah -->
        <div class="headline-section">
          <h2 class="headline-main">
            Temukan Hadis.<br>
            Pahami. <span class="gold-text">Amalkan.</span>
          </h2>
          <p class="headline-sub">Sumber autentik. Referensi terpercaya.</p>
        </div>

      </div>

    </header>

    <!-- Search Bar -->
    <div class="search-wrapper">
      <div class="search-card">
        <div class="search-input-box">
          <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          <input type="text" class="search-input" placeholder="Cari hadis, perawi, tema, atau kata kunci...">
          <button class="btn-search">Cari Hadis</button>
        </div>

        <div class="tags-container">
          <span class="tags-label">Contoh pencarian:</span>
          <a href="#" class="tag-item">niat</a>
          <a href="#" class="tag-item">iman</a>
          <a href="#" class="tag-item">shalat</a>
          <a href="#" class="tag-item">puasa</a>
          <a href="#" class="tag-item">zakat</a>
          <a href="#" class="tag-item">jihad</a>
          <a href="#" class="tag-item">akhalk</a>
        </div>
      </div>
    </div>

  </div>

</body>
</html>
