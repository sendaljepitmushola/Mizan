<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Mizan - Mesin Pencari Hadis</title>

  <!-- Google Fonts: Playfair Display & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;0,800;0,900;1,600&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --navy-primary: #0F284B;
      --gold-accent: #B58422;
      --bg-slate: #F1F4F9;
      --text-dark: #1E293B;
      --text-gray: #64748B;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-slate);
      color: var(--text-dark);
      padding: 40px 20px;
      display: flex;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
    }

    .wrapper {
      width: 100%;
      max-width: 1180px;
    }

    /* ==========================================
       HERO CONTAINER
       ========================================== */
    .hero-container {
      position: relative;
      background-image: url('bg-header.png?v=2'); 
      background-size: cover; 
      background-position: center bottom;
      background-repeat: no-repeat;
      background-color: #FFFFFF;
      border-radius: 32px;
      /* Padding bawah dikurangi dari 130px ke 80px biar gak kepanjangan */
      padding: 28px 48px 80px 48px;
      box-shadow: 0 15px 40px rgba(15, 40, 75, 0.04);
      min-height: 420px;
      overflow: hidden;
    }

    /* NAVBAR */
    .navbar {
      position: relative;
      z-index: 20;
      display: flex;
      justify-content: flex-end;
      margin-bottom: 25px;
    }

    .nav-list {
      display: flex;
      gap: 28px;
      list-style: none;
      background: rgba(255, 255, 255, 0.6);
      padding: 6px 18px;
      border-radius: 20px;
      backdrop-filter: blur(8px);
    }

    .nav-item a {
      display: flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      color: var(--text-gray);
      font-size: 0.9rem;
      font-weight: 600;
      transition: color 0.2s;
    }

    .nav-item a:hover, .nav-item.active a {
      color: var(--navy-primary);
    }

    .nav-item.active a {
      position: relative;
    }

    .nav-item.active a::after {
      content: '';
      position: absolute;
      bottom: -6px;
      left: 0;
      width: 100%;
      height: 3px;
      background-color: var(--gold-accent);
      border-radius: 2px;
    }

    /* HERO CONTENT GRID */
    .hero-content {
      position: relative;
      z-index: 10;
      display: grid;
      grid-template-columns: 280px 1fr;
      align-items: center;
      gap: 30px;
    }

    /* BRANDING (KIRI) */
    .brand-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .brand-logo-img {
      width: 180px;
      height: auto;
      margin-bottom: 8px;
      display: block;
    }

    .brand-tag {
      font-family: 'Playfair Display', serif;
      font-size: 0.78rem;
      font-weight: 800;
      color: var(--navy-primary);
      letter-spacing: 5px;
    }

    .brand-title {
      font-family: 'Playfair Display', serif;
      font-size: 3.2rem;
      font-weight: 900;
      color: var(--navy-primary);
      letter-spacing: 1px;
      line-height: 0.9;
      margin: 2px 0 4px 0;
    }

    .brand-sub {
      font-size: 0.72rem;
      font-weight: 800;
      color: var(--gold-accent);
      letter-spacing: 2.5px;
    }

    .brand-meta {
      margin-top: 18px;
      font-size: 0.75rem;
      color: var(--navy-primary);
      line-height: 1.45;
    }

    .brand-meta strong {
      color: var(--navy-primary);
      font-weight: 700;
    }

    .brand-meta span.credit-handle {
      font-style: italic;
      color: #64748B;
    }

    /* HEADLINE (TENGAH) */
    .headline-section {
      max-width: 480px;
      padding-left: 10px;
    }

    .headline-main {
      font-family: 'Playfair Display', serif;
      font-size: 2.85rem;
      font-weight: 800;
      color: var(--navy-primary);
      line-height: 1.18;
      letter-spacing: -0.5px;
    }

    .headline-main span.gold-text {
      color: var(--gold-accent);
    }

    .headline-sub {
      margin-top: 10px;
      font-size: 0.95rem;
      color: #334155;
      font-weight: 500;
    }

    /* ==========================================
       FLOATING SEARCH BAR (FIXED POSITION)
       ========================================== */
    .search-wrapper {
      position: relative;
      z-index: 30;
      max-width: 740px; /* Bikin ukurannya pas kaya mockup */
      /* Naikkan posisi ke atas mepet dengan tumpukan buku/pot bunga */
      margin: -75px auto 0 auto; 
    }

    .search-card {
      background: #FFFFFF;
      border-radius: 24px;
      padding: 18px 24px;
      box-shadow: 0 20px 45px rgba(15, 40, 75, 0.1);
      border: 1px solid rgba(226, 232, 240, 0.8);
    }

    .search-input-box {
      display: flex;
      align-items: center;
      background: #FFFFFF;
      border: 1.5px solid #E2E8F0;
      border-radius: 16px;
      padding: 6px 6px 6px 18px;
    }

    .search-input-box:focus-within {
      border-color: var(--navy-primary);
    }

    .search-icon {
      margin-right: 12px;
      color: #94A3B8;
      flex-shrink: 0;
    }

    .search-input {
      flex: 1;
      border: none;
      outline: none;
      font-size: 0.95rem;
      font-family: inherit;
      color: var(--text-dark);
    }

    .btn-search {
      background-color: var(--navy-primary);
      color: #FFFFFF;
      border: none;
      padding: 12px 28px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
    }

    .tags-container {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 14px;
      flex-wrap: wrap;
    }

    .tags-label {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-gray);
      margin-right: 4px;
    }

    .tag-item {
      background: #F1F5F9;
      color: #475569;
      padding: 4px 12px;
      border-radius: 16px;
      font-size: 0.78rem;
      font-weight: 600;
      text-decoration: none;
    }

    .tag-item:hover {
      background: #E2E8F0;
      color: var(--navy-primary);
    }
  </style>
</head>
<body>

  <div class="wrapper">

    <header class="hero-container">

      <!-- NAVBAR -->
      <nav class="navbar">
        <ul class="nav-list">
          <li class="nav-item active">
            <a href="#">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
              Beranda
            </a>
          </li>
          <li class="nav-item">
            <a href="#">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
              Pencarian
            </a>
          </li>
          <li class="nav-item">
            <a href="#">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></svg>
              Bookmark
            </a>
          </li>
          <li class="nav-item">
            <a href="#">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
              Tentang
            </a>
          </li>
        </ul>
      </nav>

      <!-- CONTENT GRID -->
      <div class="hero-content">
        
        <!-- BRANDING (KIRI) -->
        <div class="brand-section">
          <img src="logo-mizan.png?v=2" alt="Logo Mizan" class="brand-logo-img">

          <span class="brand-tag">PROJECT</span>
          <h1 class="brand-title">MIZAN</h1>
          <span class="brand-sub">MESIN PENCARI HADIS</span>

          <p class="brand-meta">
            Designed & Developed by <strong>Deny D</strong><br>
            <span class="credit-handle">--sendaljepitmushola--</span>
          </p>
        </div>

        <!-- HEADLINE (TENGAH) -->
        <div class="headline-section">
          <h2 class="headline-main">
            Temukan Hadis.<br>
            Pahami. <span class="gold-text">Amalkan.</span>
          </h2>
          <p class="headline-sub">Sumber autentik. Referensi terpercaya.</p>
        </div>

      </div>

    </header>

    <!-- FLOATING SEARCH BAR -->
    <div class="search-wrapper">
      <div class="search-card">
        <div class="search-input-box">
          <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          <input type="text" class="search-input" placeholder="Cari hadis, perawi, tema, atau kata kunci...">
          <button class="btn-search">Cari Hadis</button>
        </div>

        <div class="tags-container">
          <span class="tags-label">Contoh pencarian:</span>
          <a href="#" class="tag-item">niat</a>
          <a href="#" class="tag-item">iman</a>
          <a href="#" class="tag-item">shalat</a>
          <a href="#" class="tag-item">puasa</a>
          <a href="#" class="tag-item">zakat</a>
          <a href="#" class="tag-item">jihad</a>
          <a href="#" class="tag-item">akhlak</a>
        </div>
      </div>
    </div>

  </div>

</body>
</html>
