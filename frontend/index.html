<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Mizan - Mesin Pencari Hadis</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --navy-deep: #0A192F;
      --navy-primary: #0F284B;
      --gold-accent: #C5932B;
      --bg-slate: #F4F6F9;
      --text-dark: #1E293B;
      --text-gray: #64748B;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-slate);
      color: var(--text-dark);
      padding: 40px 20px;
      display: flex;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
    }

    .wrapper {
      width: 100%;
      max-width: 1180px;
    }

    /* ==========================================
       HERO CONTAINER (KARTU UTAMA)
       ========================================== */
    .hero-container {
      position: relative;
      background-color: #FFFFFF;
      border-radius: 36px;
      padding: 36px 48px 130px 48px;
      box-shadow: 0 15px 40px rgba(15, 40, 75, 0.04);
      overflow: hidden;
      min-height: 440px;
    }

    /* BINGKAI ARCH KIRI (PURE CSS) */
    .arch-bg-left {
      position: absolute;
      top: -20px;
      left: -30px;
      width: 380px;
      height: 120%;
      border: 1.5px solid #E2E8F0;
      border-top-right-radius: 200px;
      pointer-events: none;
      z-index: 1;
      opacity: 0.75;
    }

    .arch-bg-left-inner {
      position: absolute;
      top: 12px;
      left: 12px;
      right: -1.5px;
      bottom: -12px;
      border: 1px dashed #CBD5E1;
      border-top-right-radius: 188px;
    }

    /* ILUSTRASI MASJID DI KANAN (DIECER UKURANNYA BIAR NGAK KEBESARAN) */
    .hero-illustration-right {
      position: absolute;
      top: 0;
      right: 0;
      width: 420px; /* Ukuran dipasin biar nggak makan tempat ke tengah */
      height: 100%;
      background-image: url('kanan.png');
      background-size: contain;
      background-repeat: no-repeat;
      background-position: right top;
      z-index: 2;
      pointer-events: none;
    }

    /* NAVBAR */
    .navbar {
      position: relative;
      z-index: 10;
      display: flex;
      justify-content: flex-end;
      margin-bottom: 20px;
    }

    .nav-list {
      display: flex;
      gap: 32px;
      list-style: none;
    }

    .nav-item a {
      display: flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      color: var(--text-gray);
      font-size: 0.92rem;
      font-weight: 600;
      transition: color 0.2s;
    }

    .nav-item a:hover, .nav-item.active a {
      color: var(--navy-primary);
    }

    .nav-item.active a {
      position: relative;
    }

    .nav-item.active a::after {
      content: '';
      position: absolute;
      bottom: -6px;
      left: 0;
      width: 100%;
      height: 3px;
      background-color: var(--gold-accent);
      border-radius: 2px;
    }

    /* HERO CONTENT GRID */
    .hero-content {
      position: relative;
      z-index: 5;
      display: grid;
      grid-template-columns: 280px 1fr;
      align-items: center;
      gap: 30px;
      margin-top: 10px;
    }

    /* BRANDING (KIRI) */
    .brand-section {
      display: flex;
      flex-direction: column;
    }

    .brand-logo-svg {
      width: 110px;
      height: auto;
      margin-bottom: 8px;
    }

    .brand-tag {
      font-size: 0.72rem;
      font-weight: 800;
      color: var(--gold-accent);
      letter-spacing: 3px;
    }

    .brand-title {
      font-size: 2.6rem;
      font-weight: 800;
      color: var(--navy-primary);
      letter-spacing: 1.5px;
      line-height: 0.95;
      margin: 2px 0 4px 0;
    }

    .brand-sub {
      font-size: 0.7rem;
      font-weight: 800;
      color: var(--gold-accent);
      letter-spacing: 1.8px;
    }

    .brand-meta {
      margin-top: 20px;
      font-size: 0.76rem;
      color: var(--text-gray);
      line-height: 1.4;
    }

    .brand-meta strong {
      color: var(--navy-primary);
    }

    /* HEADLINE (TENGAH) */
    .headline-section {
      padding-left: 10px;
      max-width: 440px;
    }

    .headline-main {
      font-size: 2.5rem;
      font-weight: 800;
      color: var(--navy-primary);
      line-height: 1.25;
      letter-spacing: -0.5px;
    }

    .headline-main span.gold-text {
      color: var(--gold-accent);
    }

    .headline-sub {
      margin-top: 10px;
      font-size: 0.95rem;
      color: var(--text-gray);
      font-weight: 500;
    }

    /* ==========================================
       SEARCH BAR OVERLAY
       ========================================== */
    .search-wrapper {
      position: relative;
      z-index: 20;
      max-width: 780px;
      margin: -55px auto 0 auto;
    }

    .search-card {
      background: #FFFFFF;
      border-radius: 22px;
      padding: 16px 20px;
      box-shadow: 0 15px 35px rgba(15, 40, 75, 0.08);
      border: 1px solid #F1F5F9;
    }

    .search-input-box {
      display: flex;
      align-items: center;
      background: #FFFFFF;
      border: 1.5px solid #E2E8F0;
      border-radius: 14px;
      padding: 5px 5px 5px 16px;
    }

    .search-input-box:focus-within {
      border-color: var(--navy-primary);
    }

    .search-icon {
      margin-right: 12px;
      color: #94A3B8;
      flex-shrink: 0;
    }

    .search-input {
      flex: 1;
      border: none;
      outline: none;
      font-size: 0.95rem;
      font-family: inherit;
      color: var(--text-dark);
    }

    .btn-search {
      background-color: var(--navy-primary);
      color: #FFFFFF;
      border: none;
      padding: 12px 26px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
    }

    .tags-container {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 12px;
      flex-wrap: wrap;
    }

    .tags-label {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-gray);
      margin-right: 4px;
    }

    .tag-item {
      background: #F1F5F9;
      color: #475569;
      padding: 4px 12px;
      border-radius: 16px;
      font-size: 0.78rem;
      font-weight: 600;
      text-decoration: none;
    }

    .tag-item:hover {
      background: #E2E8F0;
      color: var(--navy-primary);
    }
  </style>
</head>
<body>

  <div class="wrapper">

    <header class="hero-container">
      
      <!-- Frame Arch Kiri -->
      <div class="arch-bg-left">
        <div class="arch-bg-left-inner"></div>
      </div>

      <!-- Ilustrasi Kanan -->
      <div class="hero-illustration-right"></div>

      <!-- NAVBAR -->
      <nav class="navbar">
        <ul class="nav-list">
          <li class="nav-item active"><a href="#">Beranda</a></li>
          <li class="nav-item"><a href="#">Pencarian</a></li>
          <li class="nav-item"><a href="#">Bookmark</a></li>
          <li class="nav-item"><a href="#">Tentang</a></li>
        </ul>
      </nav>

      <!-- CONTENT GRID -->
      <div class="hero-content">
        
        <!-- BRANDING (KIRI) -->
        <div class="brand-section">
          <!-- Logo Timbangan Mizan (Vector SVG Presisi) -->
          <svg class="brand-logo-svg" viewBox="0 0 100 60" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M10 40 C 30 32 50 36 50 45 C 50 36 70 32 90 40 L 90 46 C 70 38 50 43 50 52 C 50 43 30 38 10 46 Z" fill="#0F284B"/>
            <path d="M15 37 C 30 31 50 35 50 42 C 50 35 70 31 85 37 L 85 40 C 70 34 50 39 50 47 C 50 39 30 34 15 40 Z" fill="#C5932B"/>
            <line x1="50" y1="8" x2="50" y2="42" stroke="#C5932B" stroke-width="2"/>
            <path d="M25 18 Q 50 12 75 18" stroke="#C5932B" stroke-width="1.8" fill="none"/>
            <path d="M18 27 Q 25 31 32 27 Z" fill="#C5932B"/>
            <path d="M68 27 Q 75 31 82 27 Z" fill="#C5932B"/>
          </svg>

          <span class="brand-tag">PROJECT</span>
          <h1 class="brand-title">MIZAN</h1>
          <span class="brand-sub">MESIN PENCARI HADIS</span>

          <p class="brand-meta">
            Designed & Developed by <strong>Deny D</strong><br>
            <span style="color: #94A3B8;">--sendaljepitmushola--</span>
          </p>
        </div>

        <!-- HEADLINE (TENGAH) -->
        <div class="headline-section">
          <h2 class="headline-main">
            Temukan Hadis.<br>
            Pahami. <span class="gold-text">Amalkan.</span>
          </h2>
          <p class="headline-sub">Sumber autentik. Referensi terpercaya.</p>
        </div>

      </div>

    </header>

    <!-- SEARCH BAR -->
    <div class="search-wrapper">
      <div class="search-card">
        <div class="search-input-box">
          <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          <input type="text" class="search-input" placeholder="Cari hadis, perawi, tema, atau kata kunci...">
          <button class="btn-search">Cari Hadis</button>
        </div>

        <div class="tags-container">
          <span class="tags-label">Contoh pencarian:</span>
          <a href="#" class="tag-item">niat</a>
          <a href="#" class="tag-item">iman</a>
          <a href="#" class="tag-item">shalat</a>
          <a href="#" class="tag-item">puasa</a>
          <a href="#" class="tag-item">zakat</a>
          <a href="#" class="tag-item">jihad</a>
          <a href="#" class="tag-item">akhlak</a>
        </div>
      </div>
    </div>

  </div>

</body>
</html>
