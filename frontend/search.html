<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hasil Pencarian Hadis - Project Mizan</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        mizan: {
                            navy: '#0D1B2A',
                            gold: '#D4AF37',
                            goldHover: '#B59228',
                            bg: '#F8FAFC',
                            cardBg: '#FFFFFF',
                            textDark: '#1E293B',
                            textMuted: '#64748B'
                        }
                    },
                    fontFamily: {
                        sans: ['Poppins', 'sans-serif'],
                        arabic: ['Noto Naskh Arabic', 'serif']
                    }
                }
            }
        }
    </script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-mizan-bg font-sans text-mizan-textDark antialiased min-h-screen flex flex-col justify-between">

    <!-- HEADER / NAVBAR -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-mizan-navy flex items-center justify-center text-mizan-gold shadow-md">
                    <i data-lucide="scale" class="w-6 h-6"></i>
                </div>
                <div>
                    <h1 class="text-lg font-bold tracking-wider text-mizan-navy">PROJECT MIZAN</h1>
                    <p class="text-[10px] uppercase tracking-widest text-mizan-gold font-semibold">Mesin Pencari Hadis</p>
                </div>
            </a>

            <nav class="flex items-center space-x-6 text-sm font-medium">
                <a href="index.html" class="text-mizan-textMuted hover:text-mizan-navy transition flex items-center gap-1">
                    <i data-lucide="home" class="w-4 h-4"></i> Beranda
                </a>
                <a href="search.html" class="text-mizan-navy font-semibold border-b-2 border-mizan-navy pb-1 flex items-center gap-1">
                    <i data-lucide="search" class="w-4 h-4"></i> Pencarian
                </a>
            </nav>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full flex-1">
        
        <!-- SEARCH BAR HEADER -->
        <div class="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm mb-8">
            <form action="search.html" method="GET" class="flex flex-col md:flex-row items-center gap-3">
                <div class="flex items-center gap-3 flex-1 px-3 w-full bg-slate-50 rounded-xl border border-slate-200">
                    <i data-lucide="search" class="w-5 h-5 text-mizan-textMuted"></i>
                    <input type="text" id="searchInput" name="q" placeholder="Cari kata kunci, tema, atau perawi..." class="w-full text-sm bg-transparent py-3 focus:outline-none text-mizan-textDark">
                </div>

                <select id="bookFilter" name="book" class="w-full md:w-48 bg-slate-50 border border-slate-200 rounded-xl px-3 py-3 text-sm text-mizan-textDark focus:outline-none">
                    <option value="">Semua Kitab</option>
                    <option value="bukhari">Sahih Bukhari</option>
                    <option value="muslim">Sahih Muslim</option>
                    <option value="abudawud">Sunan Abu Dawud</option>
                    <option value="tirmidzi">Jami' at-Tirmidzi</option>
                    <option value="nasai">Sunan an-Nasa'i</option>
                    <option value="ibnumajah">Sunan Ibnu Majah</option>
                </select>

                <button type="submit" class="w-full md:w-auto bg-mizan-navy hover:bg-slate-800 text-white font-medium px-6 py-3 rounded-xl transition flex items-center justify-center gap-2">
                    Cari Hadis
                </button>
            </form>
        </div>

        <!-- SEARCH INFO -->
        <div class="flex items-center justify-between mb-6">
            <h2 class="text-lg font-bold text-mizan-navy flex items-center gap-2">
                Hasil Pencarian <span id="queryLabel" class="text-mizan-gold font-normal"></span>
            </h2>
            <span id="resultCount" class="text-xs bg-slate-200 text-slate-700 font-semibold px-3 py-1 rounded-full">0 Hadis</span>
        </div>

        <!-- HADITH CONTAINER (Dynamic via JS) -->
        <div id="hadithContainer" class="space-y-6">
            <!-- Loader State -->
            <div class="text-center py-12 text-mizan-textMuted">
                <i data-lucide="loader" class="w-8 h-8 animate-spin mx-auto text-mizan-gold mb-2"></i>
                <p class="text-sm">Memuat data hadis...</p>
            </div>
        </div>

    </main>

    <!-- FOOTER -->
    <footer class="bg-mizan-navy text-white mt-16 border-t border-slate-800 py-6 text-center text-xs text-slate-400">
        <p>© <script>document.write(new Date().getFullYear())</script> Project Mizan. All rights reserved. Designed & Developed by <span class="text-slate-200 font-semibold">Deny D</span> <span class="italic">--sendaljepitmushola--</span></p>
    </footer>

    <!-- SCRIPT FETCH DATA FROM BACKEND API -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const query = urlParams.get('q') || '';
            const book = urlParams.get('book') || '';

            // Set Form Values from URL
            if (query) document.getElementById('searchInput').value = query;
            if (book) document.getElementById('bookFilter').value = book;

            // Render Query Label
            const queryLabel = document.getElementById('queryLabel');
            if (query) queryLabel.textContent = `untuk "${query}"`;

            // Fetch from API Server
            const apiUrl = `/api/search?q=${encodeURIComponent(query)}&book=${encodeURIComponent(book)}`;

            fetch(apiUrl)
                .then(res => res.json())
                .then(data => {
                    const container = document.getElementById('hadithContainer');
                    const countBadge = document.getElementById('resultCount');
                    countBadge.textContent = `${data.total} Hadis`;

                    if (!data.results || data.results.length === 0) {
                        container.innerHTML = `
                            <div class="bg-white p-8 rounded-2xl border border-slate-100 text-center space-y-3">
                                <i data-lucide="search-x" class="w-12 h-12 text-slate-300 mx-auto"></i>
                                <h3 class="text-base font-bold text-mizan-navy">Hadis Tidak Ditemukan</h3>
                                <p class="text-xs text-mizan-textMuted">Coba gunakan kata kunci lain atau pilih kitab yang berbeda.</p>
                            </div>
                        `;
                        lucide.createIcons();
                        return;
                    }

                    container.innerHTML = data.results.map(item => `
                        <article class="bg-white p-6 sm:p-8 rounded-2xl border border-slate-100 shadow-sm space-y-6 hover:shadow-md transition">
                            <div class="flex flex-wrap items-center justify-between gap-2 border-b border-slate-100 pb-4">
                                <div class="flex items-center gap-2">
                                    <span class="bg-mizan-navy text-white text-xs font-bold px-3 py-1 rounded-lg">${item.book_name}</span>
                                    <span class="bg-amber-100 text-amber-800 text-xs font-semibold px-2.5 py-1 rounded-lg">No. ${item.number}</span>
                                </div>
                                <span class="bg-emerald-100 text-emerald-800 text-xs font-semibold px-2.5 py-0.5 rounded-full">${item.grade}</span>
                            </div>

                            <div class="text-right py-2">
                                <p class="font-arabic text-2xl sm:text-3xl leading-loose text-slate-800 font-bold">${item.arabic}</p>
                            </div>

                            <div class="space-y-2">
                                <p class="text-xs font-bold text-mizan-navy">Terjemahan:</p>
                                <p class="text-sm text-slate-600 leading-relaxed">"${item.translation}"</p>
                            </div>

                            <div class="pt-4 border-t border-slate-100 flex items-center justify-between text-xs text-mizan-textMuted">
                                <span><strong class="text-mizan-navy">Perawi:</strong> ${item.narrator}</span>
                                <button class="hover:text-mizan-navy flex items-center gap-1"><i data-lucide="bookmark" class="w-4 h-4"></i> Simpan</button>
                            </div>
                        </article>
                    `).join('');

                    lucide.createIcons();
                })
                .catch(err => {
                    console.error("Gagal memuat data API:", err);
                    document.getElementById('hadithContainer').innerHTML = `
                        <div class="bg-red-50 p-6 rounded-2xl border border-red-200 text-center text-red-700 text-sm">
                            Gagal terhubung ke API server. Pastikan server Node.js sudah berjalan.
                        </div>
                    `;
                });
        });
    </script>

    <!-- Initialize Lucide Icons -->
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
